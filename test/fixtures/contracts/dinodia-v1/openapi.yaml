      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { description: Revision-checked approve or reject receipt with exactly the requested Area grant. }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v2/homes/{homeId}/tenants:
    get:
      summary: List Home tenant membership summaries
