      responses: { "202": { description: New invitation generation issued; the prior generation is invalidated. }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v2/homes/{homeId}/tenants/{tenantId}:
    delete:
      summary: Remove a tenant membership from this Home
      operationId: removeHomeTenant
      tags: [Home]
      security: [{ MobileAccessBearer: [] }, { CustomerSessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }, { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/StepUpProof" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { description: Selected relationship removed; other valid Home relationships are preserved. }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v2/homes/{homeId}/tenants/{tenantId}/area-grants:
    put:
      summary: Replace a tenant's selected Home Area grants
      operationId: replaceHomeTenantAreaGrants
      tags: [Home]
      security: [{ MobileAccessBearer: [] }, { CustomerSessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }, { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/StepUpProof" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { description: Exact current Area-grant replacement receipt. }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" } }
components:
  securitySchemes:
    CustomerSessionCookie:
      { type: apiKey, in: cookie, name: dinodia_customer_session }
    CustomerBearer:
      { type: http, scheme: bearer, bearerFormat: customer-session }
    MobileAccessBearer:
      { type: http, scheme: bearer, bearerFormat: short-lived-account-session-access }
    AlexaBearer:
      { type: http, scheme: bearer, bearerFormat: linked-alexa-account }
    EmployeeBearer:
      { type: http, scheme: bearer, bearerFormat: signed-employee-session }
    HubSignature:
      { type: http, scheme: bearer, bearerFormat: machine-authenticated-hub-request }
    SupportSession:
      { type: http, scheme: bearer, bearerFormat: short-lived-scope-bound-support-session }
  parameters:
    HomeId:
      {
        name: homeId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 160 },
      }
    DeviceId:
      {
        name: deviceId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 160 },
      }
    IfMatch:
      { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 16, maxLength: 160 },
      }
    StepUpProof:
      { name: X-Dinodia-Step-Up-Proof, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 8192 } }
  schemas:
    CustomerMobileRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, pattern: "^dno-customer-session-[A-Za-z0-9_-]{32,160}$", writeOnly: true }
      additionalProperties: false
    HubLanEndpointObservation:
      $ref: "./contract.json#/$defs/lanEndpointObservation"
    HubLanTlsIdentityObservation:
      $ref: "./contract.json#/$defs/lanTlsIdentityObservation"
    NativeError:
      $ref: "./contract.json#/$defs/error"
    CustomerAuthChallengeState:
      type: object
      required: [ok, state]
      properties:
        ok: { const: true }
        state: { type: string, enum: [PENDING, VERIFIED, COMPLETED, EXPIRED] }
        offlineHubEnforcement: { type: string, enum: [PENDING, NOT_REQUIRED] }
      additionalProperties: false
    CustomerAuthChallengeReceipt:
      type: object
      required: [ok, challengeId, expiresAt, state]
      properties:
        ok: { const: true }
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        state: { const: PENDING }
      additionalProperties: false
    CustomerEmailResendRequest:
      type: object
      required: [challengeId, email]
      properties:
        challengeId: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
      additionalProperties: false
    CustomerAuthLinkRequest:
      type: object
      required: [challengeId, token]
      properties:
        challengeId: { type: string, format: uuid }
        token: { type: string, minLength: 40, maxLength: 64 }
      additionalProperties: false
    CustomerPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
      additionalProperties: false
    CustomerPasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword: { type: string, minLength: 12, maxLength: 1024 }
      additionalProperties: false
    CustomerPasswordResetCompleteRequest:
      oneOf:
        - $ref: "#/components/schemas/CustomerPasswordResetBasicRequest"
        - $ref: "#/components/schemas/CustomerPasswordResetWithDeviceRequest"
    CustomerPasswordResetBasicRequest:
      type: object
      required: [challengeId, token, password]
      properties:
        challengeId: { type: string, format: uuid }
        token: { type: string, minLength: 40, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 1024 }
      additionalProperties: false
    CustomerPasswordResetWithDeviceRequest:
      type: object
      required: [challengeId, token, password, deviceInstallationId, deviceName, model, osFamily, osVersion, publicKey]
      properties:
        challengeId: { type: string, format: uuid }
        token: { type: string, minLength: 40, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 1024 }
        deviceInstallationId: { type: string, pattern: "^[A-Za-z0-9:_-]{1,160}$" }
        deviceName: { type: string, minLength: 1, maxLength: 160 }
        model: { type: string, maxLength: 160 }
        osFamily: { type: string, maxLength: 80 }
        osVersion: { type: string, maxLength: 80 }
        publicKey: { type: string, maxLength: 4096 }
      additionalProperties: false
    CustomerRegistrationRequest:
      type: object
      required: [displayName, username, email, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 160 }
        username: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 1024 }
      additionalProperties: false
    CustomerPasswordChangeReceipt:
      type: object
      required: [ok, nextAction, sessionId, expiresAt, offlineHubEnforcement]
      properties:
        ok: { const: true }
        nextAction: { const: CONTINUE }
        sessionId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        offlineHubEnforcement: { const: PENDING }
      additionalProperties: false
    CustomerPasswordResetReceipt:
      type: object
      required: [ok, state, nextAction, otherSessionsRevoked, offlineHubEnforcement]
      properties:
        ok: { const: true }
        state: { const: COMPLETED }
        nextAction: { const: SIGN_IN }
        otherSessionsRevoked: { const: true }
        offlineHubEnforcement: { type: string, enum: [PENDING, NOT_REQUIRED] }
      additionalProperties: false
    CustomerPasswordResetSessionReceipt:
      $ref: "./contract.json#/$defs/customerSessionReceipt"
    CustomerAuthRequirements:
      $ref: "./contract.json#/$defs/customerAuthRequirements"
    CustomerPolicyAcceptanceRequest:
      $ref: "./contract.json#/$defs/customerPolicyAcceptanceRequest"
    CustomerPolicyAcceptanceReceipt:
      $ref: "./contract.json#/$defs/customerPolicyAcceptanceReceipt"
    AccountStepUpChallengeRequest:
      $ref: "./contract.json#/$defs/stepUpChallengeRequest"
    AccountStepUpChallengeReceipt:
      $ref: "./contract.json#/$defs/stepUpChallengeReceipt"
    AccountStepUpIssueRequest:
      $ref: "./contract.json#/$defs/stepUpIssueRequest"
    AccountStepUpProofReceipt:
      $ref: "./contract.json#/$defs/stepUpProofReceipt"
    TenantDeviceContext:
      $ref: "./contract.json#/$defs/tenantDeviceContext"
    TenantDevicePresentationMutationRequest:
      $ref: "./contract.json#/$defs/tenantDevicePresentationMutationRequest"
    TenantDeviceMutationReceipt:
      $ref: "./contract.json#/$defs/tenantDeviceMutationReceipt"
    TenantDeviceRemovalRequest:
      $ref: "./contract.json#/$defs/tenantDeviceRemovalRequest"
    TenantDeviceRemovalReceipt:
      $ref: "./contract.json#/$defs/tenantDeviceRemovalReceipt"
  responses:
    BadRequest:
      description: The canonical request DTO is malformed or violates a bounded field constraint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NativeError" }
    Unauthorized:
      description: Missing, malformed, expired or revoked customer session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NativeError" }
    Forbidden:
      description: Authenticated principal lacks current membership, role, area or device authority.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NativeError" }
    Conflict:
      description: Revision, descriptor, idempotency, trusted-device identity or lifecycle conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NativeError" }
    RateLimited:
      description: The durable account or device rate limit was reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NativeError" }
    ServiceUnavailable:
      { description: The selected home hub or required Native V2 authority is unavailable; no alternate backend is attempted }
