  /api/v2/homes/{homeId}/tenants/invitations:
    post:
      summary: Invite a tenant to exact selected-Home Areas
      operationId: inviteHomeTenant
      tags: [Home]
      security: [{ MobileAccessBearer: [] }, { CustomerSessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
