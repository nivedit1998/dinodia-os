openapi: 3.1.0
info:
  title: Dinodia Native V2 API Contract
  version: dinodia.v1
  description: >-
    Contract-only route catalogue for Native V2. Implementations must enforce current
    authenticated membership and descriptor authority; this document does not grant access.
servers:
  - url: https://dinodia-platform-v2.vercel.app
    description: Canonical Platform origin; tenant live commands use the selected hub BaseURL or verified CloudURL.
security:
  - CustomerBearer: []
tags:
  - name: Session
  - name: Home
  - name: Devices
  - name: Account
  - name: Notifications
  - name: Support
paths:
  /api/v2/auth/session:
    get:
      summary: "Restore Customer Session"
      operationId: restoreCustomerSession
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      responses:
        "200":
          {
            description: Restored account-global context and active memberships; no home is selected and no hub bearer is issued,
            content:
              {
                application/json:
                  { schema: { $ref: "./contract.json#/$defs/accountSessionContext" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: "Create Customer Session"
      operationId: createCustomerSession
      tags: [Session]
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: "./contract.json#/$defs/customerSessionLoginRequest" },
              },
          }
      responses:
        "200":
          description: Customer session established; response metadata contains no session bearer and cookie is HttpOnly.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerSessionReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: "End Compatibility Customer Session"
      operationId: endCompatibilityCustomerSession
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      responses:
        "200":
          description: Durable customer-session revocation and cookie clearing.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerSessionLogoutReceipt" }
  /api/v2/session:
    get:
      summary: "Restore Canonical Account Session"
      operationId: restoreCanonicalAccountSession
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      responses:
        "200":
          {
            description: Canonical account-global membership context,
            content:
              { application/json: { schema: { $ref: "./contract.json#/$defs/accountSessionContext" } } },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: "Create Canonical Customer Session"
      operationId: createCanonicalCustomerSession
      tags: [Session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/customerSessionLoginRequest" }
      responses:
        "200":
          description: Customer session established with an HttpOnly session cookie; receipt contains no reusable bearer.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerSessionReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: "End Canonical Customer Session"
      operationId: endCanonicalCustomerSession
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      responses:
        "200":
          description: Durable customer-session revocation.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerSessionLogoutReceipt" }
  /api/v2/session/logout:
    post:
      summary: "End Customer Session"
      operationId: endCustomerSession
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerSessionLogoutReceipt" }
  /api/v2/mobile/session:
    post:
      summary: "Create or rotate Native Mobile Session"
      operationId: createOrRotateMobileCustomerSession
      tags: [Session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "./contract.json#/$defs/customerSessionLoginRequest" }
                - { $ref: "#/components/schemas/CustomerMobileRefreshRequest" }
      responses:
        "200": { description: Short-lived access and rotating refresh credentials bound to the same current account, installation and session family; no cookie is issued., content: { application/json: { schema: { $ref: "./contract.json#/$defs/mobileSessionReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v2/mobile/session/logout:
    post:
      summary: "End Native Mobile Installation Session"
      operationId: logoutMobileCustomerSession
      tags: [Session]
      security: [{ MobileAccessBearer: [] }]
      responses:
        "200": { description: Revokes current installation sessions and offline grants., content: { application/json: { schema: { $ref: "./contract.json#/$defs/customerSessionLogoutReceipt" } } } }
  /api/v2/mobile/password/change:
    post:
      summary: "Change Customer Password from Native Mobile"
      operationId: changeMobileCustomerPassword
      tags: [Session]
      security: [{ MobileAccessBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPasswordChangeRequest" } } } }
      responses:
        "200": { description: Rotates both mobile credentials and preserves only the completing installation., content: { application/json: { schema: { $ref: "./contract.json#/$defs/mobileSessionReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/mobile/password/reset:
    post:
      summary: "Complete Customer Password Reset from Native Mobile"
      operationId: resetMobileCustomerPassword
      tags: [Session]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPasswordResetWithDeviceRequest" } } } }
      responses:
        "200": { description: Rotates both mobile credentials for the completing installation and revokes other installations., content: { application/json: { schema: { $ref: "./contract.json#/$defs/mobileSessionReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/auth/challenges/{challengeId}:
    get:
      summary: "Read One-Use Customer Authentication Challenge State"
      operationId: readCustomerAuthenticationChallenge
      tags: [Session]
      security: []
      parameters: [{ name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Opaque challenge state only; never reveals whether an account exists., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAuthChallengeState" } } } }
  /api/v2/auth/email/resend:
    post:
      summary: "Resend Customer Email Verification"
      operationId: resendCustomerEmailVerification
      tags: [Session]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerEmailResendRequest" } } } }
      responses:
        "202": { description: Bounded non-enumerating accepted response; delivery is not claimed., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAuthChallengeReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v2/auth/email/verify:
    post:
      summary: "Verify Customer Email"
      operationId: verifyCustomerEmail
      tags: [Session]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAuthLinkRequest" } } } }
      responses:
        "200":
          description: Initial verification returns VERIFIED. An authenticated mobile email change returns a rotated mobile session; cookie-backed web completion returns COMPLETED.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/CustomerAuthChallengeState" }
                  - { $ref: "./contract.json#/$defs/mobileSessionReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/auth/password/change:
    post:
      summary: "Change Customer Password"
      operationId: changeCustomerPassword
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPasswordChangeRequest" } } } }
      responses:
        "200": { description: Completing installation receives a rotated session; other installations and offline grants are revoked., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPasswordChangeReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/auth/password/forgot:
    post:
      summary: "Request Customer Password Reset"
      operationId: requestCustomerPasswordReset
      tags: [Session]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPasswordResetRequest" } } } }
      responses:
        "202": { description: Non-enumerating bounded response; provider acceptance is not inbox delivery., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAuthChallengeReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v2/auth/password/reset:
    post:
      summary: "Complete Customer Password Reset"
      operationId: completeCustomerPasswordReset
      tags: [Session]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPasswordResetCompleteRequest" } } } }
      responses:
        "200": { description: One-use reset consumed and other sessions revoked. A device-bound completion may return a rotated current-session receipt; a browser completion requires sign-in., content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/CustomerPasswordResetReceipt" }, { $ref: "#/components/schemas/CustomerPasswordResetSessionReceipt" }] } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/auth/register:
    post:
      summary: "Register Customer Account"
      operationId: registerCustomerAccount
      tags: [Session]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/CustomerRegistrationRequest" }, { $ref: "./contract.json#/$defs/invitedTenantRegistrationRequest" }] } } } }
      responses:
        "202": { description: Non-enumerating email-verification challenge receipt; no membership is created., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAuthChallengeReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v2/auth/requirements:
    get:
      summary: "Read Authenticated Customer Requirements"
      operationId: readCustomerAuthenticationRequirements
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      responses:
        "200": { description: Server-declared mandatory account action., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAuthRequirements" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/auth/policy/acceptance:
    post:
      summary: "Accept the Current Account-Global Customer Policy"
      operationId: acceptCurrentCustomerPolicy
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/customerPolicyAcceptanceRequest" }
      responses:
        "200":
          description: Explicit, idempotent acceptance of the exact server-configured policy text and version.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerPolicyAcceptanceReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/auth/security/step-up/challenge:
    post:
      summary: "Create Account-Scoped Trusted-Device Removal Challenge"
      operationId: createAccountTrustedDeviceRemovalChallenge
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountStepUpChallengeRequest" } } } }
      responses:
        "200": { description: One-use operation/target-bound challenge., content: { application/json: { schema: { $ref: "#/components/schemas/AccountStepUpChallengeReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: "Cancel Account-Scoped Trusted-Device Removal Challenge"
      operationId: cancelAccountTrustedDeviceRemovalChallenge
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [challengeId], properties: { challengeId: { type: string, format: uuid } }, additionalProperties: false } } } }
      responses:
        "200": { description: Current unused challenge cancelled., content: { application/json: { schema: { type: object, required: [ok, cancelled], properties: { ok: { const: true }, cancelled: { const: true } }, additionalProperties: false } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/auth/security/step-up/issue:
    post:
      summary: "Issue Account-Scoped Trusted-Device Removal Proof"
      operationId: issueAccountTrustedDeviceRemovalProof
      tags: [Session]
      security: [{ CustomerSessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountStepUpIssueRequest" } } } }
      responses:
        "200": { description: Short-lived proof bound to this customer session and target., content: { application/json: { schema: { $ref: "#/components/schemas/AccountStepUpProofReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/hub-sessions:
    post:
      summary: "Issue Selected Tenant Home Hub Session"
      operationId: issueSelectedHomeHubSession
      tags: [Session]
      description: "Requires an active selected TENANT membership. OWNER and PROPERTY_MANAGER sessions are denied and receive no direct OS endpoint or bearer; those roles use the Platform projection."
      security: [{ CustomerSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [homeId]
              properties:
                homeId: { $ref: "./contract.json#/$defs/id" }
              additionalProperties: false
      responses:
        "200":
          description: Five-minute home- and membership-bound customer bearer; native client memory only, never persisted, logged or rendered.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerHubSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { description: Invalid or missing selected-home request }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/offline-authorisations:
    post:
      summary: "Create Exact Membership Offline Authorisation"
      operationId: createOfflineMembershipAuthorisation
      tags: [Session]
      security: [{ CustomerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/offlineAuthorisationRequest" }
      responses:
        "200":
          description: Tenant-only local authority for the already selected home, membership and enrolled trusted device.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/offlineAuthorisationReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { description: Trusted device public key or request fields are invalid. }
    delete:
      summary: "Revoke Current Membership Offline Authorisation"
      operationId: revokeOfflineMembershipAuthorisation
      tags: [Session]
      security: [{ CustomerBearer: [] }]
      responses:
        "200":
          description: Current trusted-device authority is revoked for the selected membership.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/offlineRevocationReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/security/step-up/challenge:
    post:
      summary: "Create Operation-Bound Step-Up Challenge"
      operationId: createStepUpChallenge
      tags: [Session]
      security: [{ CustomerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/stepUpChallengeRequest" }
      responses:
        "200":
          description: Single-use challenge bound to the authenticated customer session, selected membership, target and operation digest.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/stepUpChallengeReceipt" }
        "400": { description: Operation or target is malformed or unsupported. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: "Cancel Unconsumed Step-Up Challenge"
      operationId: cancelStepUpChallenge
      tags: [Session]
      security: [{ CustomerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/stepUpCancellationRequest" }
      responses:
        "200":
          description: Only the current customer session may cancel its own unused challenge.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/stepUpCancellationReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/security/step-up/issue:
    post:
      summary: "Issue One-Use Step-Up Proof"
      operationId: issueStepUpProof
      tags: [Session]
      security: [{ CustomerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/stepUpIssueRequest" }
      responses:
        "200":
          description: A proof bound to one actor/session/home/membership/operation/target and consumed challenge; clients must keep it in memory only.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/stepUpProofReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/security/step-up/consume:
    post:
      summary: "Consume Step-Up Proof For Exact Operation"
      operationId: consumeStepUpProof
      tags: [Session]
      security: [{ CustomerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/stepUpConsumeRequest" }
      responses:
        "200":
          description: Proof consumed atomically; no reusable proof is returned.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/stepUpConsumeReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/support/notifications:
    get:
      summary: "List Selected Membership Support Notifications"
      operationId: listSelectedSupportNotifications
      tags: [Notifications, Support]
      security: [{ CustomerBearer: [] }]
      responses:
        "200":
          description: Only the authenticated account and selected home notification projection; no private support details are included.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/supportNotificationProjection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/support/access-requests:
    get:
      summary: "List pending support approvals for the selected membership"
      operationId: listSupportAccessApprovals
      tags: [Support]
      responses:
        "200":
          description: Bounded approval metadata only; ticket descriptions and tenant/device-private details are never included.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/supportAccessApprovalProjection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/homes/{homeId}/context:
    get:
      summary: "Get Membership Scoped Home Context"
      operationId: getMembershipScopedHomeContext
      tags: [Home]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          {
            description: Selected-home membership context,
            content:
              {
                application/json:
                  { schema: { $ref: "./contract.json#/$defs/membership" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/homes/{homeId}/access-policy:
    get:
      summary: "Get Current Home Access Policy"
      operationId: getCurrentHomeAccessPolicy
      tags: [Home]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          {
            description: Current role and area authority,
            content:
              {
                application/json:
                  { schema: { $ref: "./contract.json#/$defs/accessPolicy" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/homes/{homeId}/overrides:
    get:
      summary: "List Home Display Overrides"
      operationId: listHomeDisplayOverrides
      tags: [Home]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          {
            description: Revisioned display-only overrides,
            content:
              {
                application/json:
                  { schema: { $ref: "./contract.json#/$defs/override" } },
              },
          }
    put:
      summary: "Replace Home Display Overrides"
      operationId: replaceHomeDisplayOverrides
      tags: [Home]
      parameters:
        [
          { $ref: "#/components/parameters/HomeId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "./contract.json#/$defs/override" } },
            },
        }
      responses:
        "200": { description: Overrides saved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/preferences:
    get:
      summary: "Get Home Preferences"
      operationId: getHomePreferences
      tags: [Home]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        { "200": { description: Revisioned selected-home preferences plus a server-derived role catalogue. For property managers, availableFamilies contains only families assigned by the current original homeowner; mandatory notices are listed separately and are not user-toggleable. } }
    put:
      summary: "Update Home Preferences"
      operationId: updateHomePreferences
      tags: [Home]
      parameters:
        [
          { $ref: "#/components/parameters/HomeId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        "200": { description: Preferences saved }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/tenant-device-context:
    get:
      summary: "Get Selected Tenant Device Context"
      operationId: getSelectedTenantDeviceContext
      tags: [Devices]
      security: [{ MobileAccessBearer: [] }]
      description: >-
        Returns only cloud-owned tenant membership, active Area grants, authorized
        device metadata, tenant-owned management flags, scoped dashboard preference
        revision and owner-only recovery summaries. It never returns device state or
        controls; those are fetched directly from the selected Native V2 hub. Requires
        an account-global customer session, X-Dinodia-Home-Id matching the path and an
        active TENANT membership. Private tenant devices are filtered before response.
      parameters:
        - { $ref: "#/components/parameters/HomeId" }
        - { name: X-Dinodia-Home-Id, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Selected tenant projection; no-store and membership-scoped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDeviceContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Forbidden" }
  /api/v2/homes/{homeId}/tenant-devices/{deviceId}:
    patch:
      summary: "Update an owned tenant device presentation"
      operationId: updateOwnedTenantDevicePresentation
      tags: [Devices]
      security: [{ MobileAccessBearer: [] }]
      description: >-
        Rename, relabel or move only a tenant_device owned by the currently selected
        active tenant membership. The server verifies the current session,
        owner membership, Home/hub identity and expected inventory revision.
        Idempotency-Key reconciles an exact retry. Permanent property devices,
        other tenants' devices, technical labels and live hub state are immutable
        through this operation. A move must target one currently granted Area and
        remains pending until the signed hub configuration is applied.
      parameters:
        - { $ref: "#/components/parameters/HomeId" }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Dinodia-Home-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, expectedInventoryRevision, overrideName]
                  properties:
                    action: { const: rename }
                    expectedInventoryRevision: { type: integer, minimum: 1 }
                    overrideName: { type: [string, 'null'], maxLength: 80 }
                - type: object
                  additionalProperties: false
                  required: [action, expectedInventoryRevision, customerLabel]
                  properties:
                    action: { const: relabel }
                    expectedInventoryRevision: { type: integer, minimum: 1 }
                    customerLabel: { type: [string, 'null'], maxLength: 40 }
                - type: object
                  additionalProperties: false
                  required: [action, expectedInventoryRevision, areaId]
                  properties:
                    action: { const: move }
                    expectedInventoryRevision: { type: integer, minimum: 1 }
                    areaId: { type: string, format: uuid }
      responses:
        "200":
          description: Tenant-owned presentation updated or exact retry reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDeviceMutationReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/installation-requests:
    get:
      summary: "List Current Home Permanent-Installation Requests"
      operationId: listHomeInstallationRequests
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200": { description: Current bounded requests visible to the selected owner or manager., content: { application/json: { schema: { $ref: "./contract.json#/$defs/installationRequestListReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Selected Home or owner/manager membership is unavailable. }
    post:
      summary: "Request Permanent Device Installation"
      operationId: createHomeInstallationRequest
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./contract.json#/$defs/installationRequestCreate" } } } }
      responses:
        "201": { description: Home-scoped installation request created without creating or changing a membership., content: { application/json: { schema: { $ref: "./contract.json#/$defs/installationRequestReceipt" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Selected Home or owner/manager membership is unavailable. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/installation-requests/{requestId}/cancel:
    post:
      summary: "Cancel a Not-Yet-Assigned Installation Request"
      operationId: cancelHomeInstallationRequest
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }, { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./contract.json#/$defs/installationRequestCancel" } } } }
      responses:
        "200": { description: Idempotent cancellation receipt., content: { application/json: { schema: { $ref: "./contract.json#/$defs/installationRequestReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Request is not visible to the selected Home. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/tenant-devices/{deviceId}/remove:
    post:
      summary: "Request removal of the current tenant's own device"
      operationId: requestTenantOwnedDeviceRemoval
      tags: [Devices]
      security: [{ MobileAccessBearer: [] }]
      description: >-
        Requires a fresh operation-bound confirmation for this exact device and
        current descriptor revision. The cloud first revokes its selected-tenant
        authority and returns REMOVAL_PENDING; only the direct Native V2 OS removal
        and tombstone acknowledgement may report enforcement complete. Property
        devices and another tenant's devices are never removable by this route.
      parameters:
        - { $ref: "#/components/parameters/HomeId" }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Dinodia-Home-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantDeviceRemovalRequest" }
      responses:
        "202":
          description: Cloud authority is removed and hub enforcement is pending, or an exact retry is reconciled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDeviceRemovalReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/me/push-registration:
    put:
      summary: "Register or rotate the current trusted installation APNs token"
      operationId: registerCurrentInstallationPushToken
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/apnsRegistrationRequest" }
      responses:
        "200": { description: Encrypted token stored for the session-bound trusted installation, content: { application/json: { schema: { $ref: "./contract.json#/$defs/apnsRegistrationReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: "Disable push registration for the current trusted installation"
      operationId: disableCurrentInstallationPushToken
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      responses:
        "200": { description: Current installation token removed; replay is idempotent, content: { application/json: { schema: { $ref: "./contract.json#/$defs/apnsRegistrationReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/homes/{homeId}/tenant/access:
    get:
      summary: "Preview Removal of the Selected Tenant Home Access"
      operationId: previewTenantHomeAccessRemoval
      tags: [Account, Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          description: Selected-tenant preview with current revisions and only a boolean indicating whether other valid relationships remain.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/tenantMembershipRemovalPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: "Remove Only the Current Tenant Membership"
      operationId: removeSelectedTenantHomeAccess
      tags: [Account, Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/tenantMembershipRemovalRequest" }
      responses:
        "200":
          description: Exact membership removed, offline authority revoked and hub cleanup queued; final-account deletion occurs only after the explicit final-relationship confirmation.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/tenantMembershipRemovalReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/analytics/{period}:
    get:
      summary: "Get Home Analytics"
      operationId: getHomeAnalytics
      tags: [Home]
      parameters:
        - { $ref: "#/components/parameters/HomeId" }
        - name: period
          in: path
          required: true
          schema: { type: string, enum: [year, month, week, day, hour] }
      responses:
        "200":
          {
            description: Sample-based Native analytics,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "./contract.json#/$defs/analyticsObservation" },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/homes/{homeId}/areas:
    get:
      summary: "List Invitation Areas for Current Home Managers"
      operationId: listInvitationAreas
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          description: Active Area IDs and names plus the current management revision, visible only to an active owner or property manager.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/homeInvitationAreasReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Home or owner/manager membership is not visible to this account. }
  /api/v2/homes/{homeId}/property-managers:
    get:
      summary: "List Property Managers"
      operationId: listPropertyManagers
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          description: Current active manager memberships, without account email or private property data.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerPropertyManagerListReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Home or membership not visible to this account. }
    post:
      summary: "Invite Property Manager"
      operationId: invitePropertyManager
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/HomeId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/customerMembershipInvitationRequest" }
      responses:
        "201":
          description: Invitation created; invitation alone does not create membership.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerMembershipInvitationReceipt" }
        "200": { description: Exact duplicate request coalesced to its existing invitation receipt. }
        "202": { description: The idempotent request is still being submitted to the mail provider. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/tenant/invitations:
    post:
      summary: "Invite a Tenant to Exact Current Areas"
      operationId: inviteTenant
      tags: [Home]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/HomeId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/customerMembershipInvitationRequest" }
      responses:
        "201":
          description: Tenant invitation submitted; only the requested current Area grants can be accepted.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerMembershipInvitationReceipt" }
        "200": { description: Exact duplicate request coalesced to its existing invitation receipt. }
        "202": { description: The idempotent request is still being submitted to the mail provider. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/homes/{homeId}/tenant/devices:
    get:
      summary: "List Authorized Native Devices"
      operationId: listAuthorizedNativeDevices
      tags: [Devices]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        "200":
          {
            description: Selected-membership devices only,
            content:
              {
                application/json:
                  { schema: { $ref: "./contract.json#/$defs/device" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/homes/{homeId}/tenant/devices/{deviceId}:
    get:
      summary: "Get Authorized Native Device"
      operationId: getAuthorizedNativeDevice
      tags: [Devices]
      parameters:
        [
          { $ref: "#/components/parameters/DeviceId" },
          { $ref: "#/components/parameters/HomeId" },
        ]
      responses:
        "200":
          {
            description: Current device descriptor,
            content:
              {
                application/json:
                  { schema: { $ref: "./contract.json#/$defs/device" } },
              },
          }
        "404": { description: Missing or privacy-hidden device }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/dinodia/v1/devices:
    get:
      summary: "Read Selected Home Hub Device Descriptors"
      operationId: readSelectedHomeHubDeviceDescriptors
      tags: [Devices]
      description: Direct authenticated request to the selected hub over pinned HTTPS LAN BaseURL or the independently verified CloudURL. The home and membership are taken from the signed app token, never from query parameters.
      servers:
        - url: https://dinodia-{hubId}.local:8123
          variables:
            hubId: { default: hub-identifier, description: "Public hub DNS label, not an authority claim" }
      responses:
        "200":
          description: Current membership/area filtered canonical Native v1 device envelope
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, homeId, streamId, sequence, generatedAt, revision, data]
                properties:
                  schemaVersion: { const: dinodia.v1 }
                  homeId: { type: string }
                  streamId: { type: string }
                  sequence: { type: integer, minimum: 0 }
                  generatedAt: { type: string, format: date-time }
                  revision: { type: integer, minimum: 0 }
                  data:
                    type: array
                    items: { $ref: "./contract.json#/$defs/device" }
                additionalProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Current catalogue cannot be represented without losing safety or authority fields }
  /api/v2/alexa/discovery:
    get:
      summary: "Get Native Alexa Discovery Projection"
      operationId: getNativeAlexaDiscoveryProjection
      tags: [Devices]
      security: [{ AlexaBearer: [] }]
      description: Stage 2 contract boundary. Account linking and live projection execution are owned by the later Alexa integration stage; until enabled, consumers must fail closed and must not fall back to HA or static data.
      responses:
        "200":
          description: Current selected-home and area-scoped canonical discovery projection
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/alexaDiscoveryProjection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Alexa account-linking/projection feature is not enabled in this stage; no fallback is permitted }
  /api/v2/alexa/directives:
    post:
      summary: "Dispatch Native Alexa Directive"
      operationId: dispatchNativeAlexaDirective
      tags: [Devices]
      security: [{ AlexaBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [directive], properties: { directive: { type: object } }, additionalProperties: false }
      responses:
        "200": { description: Canonical selected-home directive result }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { description: Alexa directive execution is not enabled in this stage; no HA/entity fallback is permitted }
  /api/v2/alexa/report-state:
    post:
      summary: "Report Native Alexa State"
      operationId: reportNativeAlexaState
      tags: [Devices]
      security: [{ AlexaBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [directive], properties: { directive: { type: object } }, additionalProperties: false }
      responses:
        "200": { description: Current canonical control state projection }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Alexa report-state projection is not enabled in this stage; no static fallback is permitted }
  /api/dinodia/v1/commands:
    post:
      summary: "Issue Dinodia OSCommand"
      operationId: issueDinodiaOSCommand
      tags: [Devices]
      description: Tenant live command is sent directly to the selected hub's pinned HTTPS BaseURL or verified CloudURL. Platform does not proxy device commands; HA/AWS transports are forbidden.
      servers:
        - url: https://dinodia-{hubId}.local:8123
          description: Illustrative pinned LAN authority; resolve the selected hub endpoint from its current Platform record.
          variables:
            hubId:
              {
                default: hub-identifier,
                description: "Public hub DNS label, not an authority claim",
              }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "./contract.json#/$defs/command" } },
            },
        }
      responses:
        "202": { description: Hub accepted idempotent command }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          {
            description: Current descriptor rejects command value or sensitive policy,
          }
  /api/dinodia/v1/maintenance/status:
    servers:
      - url: https://dinodia-{hubId}.local:8123
        description: Current selected tenant hub over its pinned HTTPS LAN endpoint or verified CloudURL.
        variables:
          hubId: { default: hub-identifier, description: Public hub DNS label resolved from the authenticated selected-home session. }
    get:
      summary: Read native updater maintenance status
      operationId: readNativeUpdaterMaintenanceStatus
      tags: [Devices]
      description: Read-only. Requires a current selected tenant hub session or an authenticated scoped Dinodia operator; exposes no signing material, artifact URL or environment data. A disabled release-signing trust state is reported as unprovisioned and does not enable updates.
      security: [{ CustomerBearer: [] }]
      responses:
        "200":
          description: Bounded updater phase and release status.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/updaterMaintenanceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/tenant/account/delete:
    post:
      summary: "Delete Customer Account"
      operationId: deleteCustomerAccount
      tags: [Account]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202":
          {
            description: Account deletion follows final-relationship retention rules,
