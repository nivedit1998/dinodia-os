      responses:
        { "204": { description: Notification acknowledgement recorded } }
  /api/v2/homes/{homeId}/activity:
    get:
      summary: "List Home Activity"
      operationId: listHomeActivity
      tags: [Home]
      parameters: [{ $ref: "#/components/parameters/HomeId" }]
      responses:
        { "200": { description: Role-filtered activity for selected home } }
  /api/v2/trusted-devices:
    get:
      summary: "List Trusted Customer Devices"
      operationId: listTrustedCustomerDevices
      tags: [Account]
      responses: { "200": { description: Current account's trusted devices } }
  /api/v2/me/pending-relationships:
    get:
      summary: "List Safe Pending Customer Relationships"
      operationId: listCustomerPendingRelationships
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      responses:
        "200":
          description: Account-global bounded pending projection; includes only server-declared actions and no protected home/device detail.
          content:
            application/json:
              schema: { $ref: "./contract.json#/$defs/customerPendingRelationshipsProjection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v2/me/profile:
    get:
      summary: "Read the authenticated customer's account profile"
      operationId: getCustomerProfile
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      responses:
        "200": { description: Account-global profile only; home address and membership authority are not returned., content: { application/json: { schema: { $ref: "./contract.json#/$defs/customerProfileReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: "Update account profile with exact fresh trusted-device proof"
