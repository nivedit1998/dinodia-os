        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/customerProfileUpdateRequest" }
      responses:
        "200": { description: Exact account profile revision updated; phone remains optional and unverified., content: { application/json: { schema: { $ref: "./contract.json#/$defs/customerProfileReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/me/username:
    patch:
      summary: Select the invited tenant username after email verification and mandatory password replacement
      operationId: selectInvitedTenantUsername
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/invitedTenantUsernameRequest" }
      responses:
        "200": { description: Final username selected; the account may now proceed to its current policy and pending invitation gate., content: { application/json: { schema: { $ref: "./contract.json#/$defs/invitedTenantUsernameReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/me/email-change:
    post:
      summary: Request a verified account email change
      operationId: requestCustomerEmailChange
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./contract.json#/$defs/customerEmailChangeRequest" }
      responses:
        "202": { description: New address remains pending; existing address stays active until one-use confirmation., content: { application/json: { schema: { $ref: "./contract.json#/$defs/customerEmailChangeReceipt" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/invitations/{invitationId}/decision:
    post:
      summary: "Accept or Decline a Current Property Invitation"
      operationId: decideCustomerMembershipInvitation
      tags: [Account]
      security: [{ CustomerSessionCookie: [] }, { MobileAccessBearer: [] }]
